name: flutter_widgets_hub_showcase
description: >
  WidgetCode: exemplos dos widgets nativos do Flutter rodando de verdade,
  com o código-fonte real de cada um.
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # Gera lib/l10n/app_localizations.dart a partir dos arquivos .arb (textos
  # da interface em pt, en e es). Configuração em l10n.yaml.
  generate: true
  # Os arquivos de exemplo também viram assets: a tela de código lê o
  # próprio arquivo que roda na demo. Pastas de asset não são recursivas:
  # cada seção nova precisa da sua linha aqui.
  assets:
    - lib/learn/examples/buttons/
    - lib/learn/examples/layout/
    - lib/learn/examples/text_images/
    - lib/learn/examples/lists/
    - lib/learn/examples/forms/
    - lib/learn/examples/selection/
    - lib/learn/examples/feedback/
    - lib/learn/examples/navigation/
    - lib/learn/examples/cards/
    - lib/learn/examples/gestures/
    - lib/learn/examples/animations/
    - lib/learn/examples/cupertino/
    # Imagens usadas pelos próprios exemplos (Image.asset, AssetImage).
    - assets/images/
    # Só o ícone pequeno do diálogo "Sobre"; o resto de assets/icon/ é a
    # fonte dos ícones do app e não vai dentro dele.
    - assets/icon/app_icon_about.png

# Ícones do app (Android e web), gerados a partir de assets/icon/ com:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  min_sdk_android: 21
  # Ícone adaptativo (Android 8+): fundo azul liso e o símbolo por cima,
  # recortado pelo formato que cada aparelho usa. O monocromático é o dos
  # ícones temáticos (Android 13+).
  adaptive_icon_background: "#0169B8"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_foreground_inset: 16
  adaptive_icon_monochrome: assets/icon/app_icon_monochrome.png
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#0169B8"
    theme_color: "#0169B8"
