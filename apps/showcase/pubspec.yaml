name: flutter_widgets_hub_showcase
description: >
  App de vitrine do flutterwidgetshub — renderiza cada widget do catálogo
  de verdade, lado a lado com o código-fonte real.
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_widgets_hub:
    path: ../../packages/flutter_widgets_hub
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
