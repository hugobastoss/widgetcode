name: flutter_widgets_hub_showcase
description: >
  App de vitrine do flutterwidgetshub — renderiza cada widget do catálogo
  de verdade, lado a lado com o código-fonte real.
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_widgets_hub:
    path: ../../packages/flutter_widgets_hub
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Os arquivos de exemplo também viram assets: a tela de código lê o
  # próprio arquivo que roda na demo. Pastas de asset não são recursivas —
  # cada seção nova precisa da sua linha aqui.
  assets:
    - lib/learn/examples/buttons/
    - lib/learn/examples/layout/
    - lib/learn/examples/text_images/
    - lib/learn/examples/lists/
    - lib/learn/examples/forms/
    - lib/learn/examples/selection/
    # Imagens usadas pelos próprios exemplos (Image.asset, AssetImage).
    - assets/images/
