name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Roda cada exemplo numa tela de 360 de largura e falha se o
      # manifest/widgets.json ou o CATALOG.md não baterem com o cadastro.
      - name: Test
        run: flutter test
