name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Analyze (packages + showcase)
        run: flutter analyze

      # O pacote packages/flutter_widgets_hub está inativo neste projeto (são
      # widgets de design de outros apps): continua sendo analisado acima, mas
      # não tem mais etapa de teste própria.

      # Inclui o teste que falha se manifest/widgets.json não bater com os
      # exemplos cadastrados no app.
      - name: Test showcase app
        run: flutter test
        working-directory: apps/showcase

      - name: Build showcase app (web)
        run: flutter build web
        working-directory: apps/showcase
